# Test configuration - uses H2 in-memory database instead of MySQL
spring.datasource.url=jdbc:h2:mem:chunkvault_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ChunkVault test defaults (can be overridden by @TestPropertySource)
chunkvault.chunk-size-bytes=1048576
chunkvault.storage-root=target/test-storage
chunkvault.nodes=nodeA,nodeB,nodeC
